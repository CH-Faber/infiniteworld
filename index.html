<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>武侠客栈 · 无限世界</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307080a'/%3E%3Ctext x='16' y='21' font-size='15' text-anchor='middle' fill='%23e9b978'%3E听%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="stage"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div id="fade" aria-hidden="true"></div>

<header id="brand">
  <div class="brand-name">武侠客栈</div>
  <div class="brand-sub">听雨楼 · 第二关</div>
</header>

<div id="hud">
  <div class="stat"><span class="stat-k">赏钱</span><i id="bar-silver"></i><span class="stat-v" id="val-silver">零</span></div>
  <div class="stat"><span class="stat-k">名声</span><i id="bar-fame"></i><span class="stat-v" id="val-fame">零</span></div>
  <div class="stat"><span class="stat-k">疑心</span><i id="bar-suspicion"></i><span class="stat-v" id="val-suspicion">零</span></div>
  <div class="stat"><span class="stat-k">已斟</span><i id="bar-served"></i><span class="stat-v" id="val-served">零</span></div>
</div>

<div id="hint">三桌客人等着上酒，散桌等着添茶</div>
<div id="cursor-tag"></div>
<div id="reticle" hidden><i></i><span id="reticle-label"></span></div>

<section id="dialog" class="panel" hidden>
  <div class="panel-rule"></div>
  <div class="panel-body">
    <p class="speaker" id="speaker"></p>
    <p class="line" id="line"></p>
    <div class="choices" id="choices"></div>
    <button class="next" id="next" hidden>继续</button>
  </div>
</section>

<div id="toast" hidden></div>

<footer id="footer">
  <button id="sound" title="声音">风雪 · 开</button>
  <span class="footer-hint">点击画面锁定视角 · 准星对准客人 · ESC 松开</span>
</footer>

<script src="shared/save-protocol.js"></script>
<script>
(function () {
  var hasWL = typeof WL !== 'undefined' && WL;
  window.IW_HANDOFF = {
    read: function () {
      return hasWL && WL.readSave ? WL.readSave() : {};
    },
    complete: function (save, opts) {
      if (!hasWL || !WL.completeLevel) return null;
      return WL.completeLevel(window.CONFIG || {}, save, opts);
    },
    fail: function (reason, save) {
      if (!hasWL || !WL.failLevel) return null;
      return WL.failLevel(reason, save, window.CONFIG || {});
    }
  };
})();
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
