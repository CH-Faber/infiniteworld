<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>听雨楼 · 无限世界</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="stage"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header id="brand">
  <div class="brand-name">听雨楼</div>
  <div class="brand-sub">副本 · 第一夜</div>
</header>

<div id="hud">
  <div class="stat"><span class="stat-k">银两</span><i id="bar-silver"></i><span class="stat-v" id="val-silver">零</span></div>
  <div class="stat"><span class="stat-k">名声</span><i id="bar-fame"></i><span class="stat-v" id="val-fame">零</span></div>
  <div class="stat"><span class="stat-k">疑心</span><i id="bar-suspicion"></i><span class="stat-v" id="val-suspicion">零</span></div>
</div>

<div id="hint">挪动视线，找找堂上还有什么</div>
<div id="cursor-tag"></div>

<section id="dialog" class="panel" hidden>
  <div class="panel-rule"></div>
  <div class="panel-body">
    <p class="speaker" id="speaker"></p>
    <p class="line" id="line"></p>
    <div class="choices" id="choices"></div>
    <button class="next" id="next" hidden>继续</button>
  </div>
</section>

<div id="toast" hidden></div>

<section id="intro">
  <p class="intro-line">欢迎来到无限世界</p>
</section>

<section id="ending" hidden>
  <div class="ending-inner">
    <p class="ending-kicker">副本结束</p>
    <h1 class="ending-title" id="ending-title"></h1>
    <p class="ending-text" id="ending-text"></p>
    <div class="ending-stats" id="ending-stats"></div>
    <p class="ending-note">你留下的东西，下一队推门时会先看见它。</p>
    <button class="again" id="again">再推一次门</button>
  </div>
</section>

<footer id="footer">
  <button id="sound" title="声音">雨声 · 开</button>
  <span class="footer-hint">拖拽可轻微环视</span>
</footer>

<script type="module" src="src/main.js"></script>
</body>
</html>
